<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>紫微斗數・八字命盤|線上排盤命館</title>
<meta name="description" content="輸入出生年月日時間,即時排出紫微斗數命盤與八字四柱,附詳細解說、大運流年、合八字與取名建議。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F5EEDC; --paper2:#EFE5CC; --ink:#2A2520; --ink2:#5A5248;
  --cinnabar:#A93B2A; --gold:#8C7242; --navy:#2E4B63; --line:#C9BC9C;
  --wood:#3E6B4F; --fire:#A93B2A; --earth:#8C7242; --metal:#7A6A50; --water:#2E4B63;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Serif TC","Kaiti TC","DFKai-SB","標楷體",serif;
  background:var(--paper); color:var(--ink); line-height:1.85; font-size:16px;
  background-image:radial-gradient(ellipse at 20% 0%,rgba(140,114,66,.06),transparent 50%),
    radial-gradient(ellipse at 90% 100%,rgba(169,59,42,.05),transparent 45%);
}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 60px}
/* ===== 頁首 ===== */
header{text-align:center;padding:46px 0 26px;position:relative}
header .deco{font-size:13px;letter-spacing:.6em;color:var(--gold);text-indent:.6em}
h1{font-size:clamp(30px,6vw,46px);font-weight:900;letter-spacing:.18em;text-indent:.18em;margin:8px 0 4px}
h1 .dot{color:var(--cinnabar)}
header .sub{color:var(--ink2);font-size:14px;letter-spacing:.2em}
header::after{content:"";display:block;width:160px;height:2px;margin:20px auto 0;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}
/* ===== 分頁 ===== */
.tabs{display:flex;justify-content:center;gap:10px;margin:26px 0 18px;flex-wrap:wrap}
.tabbtn{
  font-family:inherit;font-size:17px;letter-spacing:.15em;padding:10px 26px;cursor:pointer;
  background:transparent;color:var(--ink2);border:1px solid var(--line);border-radius:2px;
  transition:all .2s;
}
.tabbtn.on{background:var(--cinnabar);color:#FBF6E9;border-color:var(--cinnabar);box-shadow:2px 2px 0 rgba(42,37,32,.18)}
.tab.hide{display:none}
/* ===== 卡片與表單 ===== */
.card{
  background:rgba(255,252,243,.72); border:1px solid var(--line); border-radius:3px;
  padding:24px 22px; margin-bottom:22px; box-shadow:0 1px 0 rgba(42,37,32,.06);
  position:relative;
}
.card::before{content:"";position:absolute;inset:5px;border:1px solid rgba(140,114,66,.25);border-radius:2px;pointer-events:none}
.card h2{font-size:20px;letter-spacing:.2em;color:var(--navy);margin-bottom:14px;font-weight:700}
.card h2::before{content:"◆";color:var(--cinnabar);font-size:12px;margin-right:8px;vertical-align:2px}
.frow{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.frow label{font-size:15px;color:var(--ink2);min-width:64px}
select,input[type=text]{
  font-family:inherit;font-size:16px;padding:8px 10px;background:#FFFDF5;color:var(--ink);
  border:1px solid var(--line);border-radius:2px;outline:none;
}
select:focus,input:focus{border-color:var(--gold)}
.gender{display:flex;gap:14px;align-items:center;font-size:16px}
.gender input{accent-color:var(--cinnabar);transform:scale(1.15);margin-right:4px}
.btn{
  font-family:inherit;font-size:18px;letter-spacing:.3em;text-indent:.3em;
  padding:12px 40px;cursor:pointer;border:none;border-radius:2px;
  background:var(--cinnabar);color:#FBF6E9;box-shadow:3px 3px 0 rgba(42,37,32,.2);
  transition:transform .12s;
}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 rgba(42,37,32,.2)}
.btn.alt{background:var(--navy)}
.btnrow{text-align:center;margin-top:6px}
.note{font-size:13px;color:var(--ink2);margin-top:10px}
/* ===== 結果區 ===== */
.hide{display:none}
.kv{display:flex;gap:14px;padding:6px 0;border-bottom:1px dashed rgba(201,188,156,.6);font-size:16px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--ink2);min-width:84px;letter-spacing:.25em}
.kv b{font-weight:700}
/* 四柱表 */
.pillars{width:100%;border-collapse:collapse;text-align:center;margin-top:4px}
.pillars th,.pillars td{border:1px solid var(--line);padding:8px 6px;font-size:15px}
.pillars tr:first-child th{background:var(--ink);color:#F0E8D5;letter-spacing:.2em;font-weight:600}
.pillars th{background:var(--paper2);color:var(--ink2);font-weight:600}
.pillars .big{font-size:30px;font-weight:900;line-height:1.2}
.pillars small{display:block;font-size:11px;color:var(--ink2)}
.dim{color:var(--ink2);font-size:13px}
/* 五行色 */
.e木{color:var(--wood)} .e火{color:var(--fire)} .e土{color:var(--earth)}
.e金{color:var(--metal)} .e水{color:var(--water)}
/* 五行能量條 */
.bars{margin-top:6px}
.barrow{display:flex;align-items:center;gap:10px;margin:7px 0}
.blabel{width:24px;font-weight:700;font-size:17px}
.btrack{flex:1;height:14px;background:rgba(201,188,156,.3);border-radius:1px;overflow:hidden}
.bfill{height:100%;border-radius:1px}
.f木{background:var(--wood)} .f火{background:var(--fire)} .f土{background:var(--earth)}
.f金{background:var(--metal)} .f水{background:var(--water)}
.bval{width:42px;text-align:right;font-size:14px;color:var(--ink2);font-variant-numeric:tabular-nums}
/* 大運 */
.dy-note{font-size:14px;color:var(--ink2);margin-bottom:10px}
.dyrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.dycard{
  min-width:86px;text-align:center;border:1px solid var(--line);border-radius:2px;
  padding:10px 6px;background:#FFFDF5;flex-shrink:0;
}
.dygz{font-size:21px;font-weight:900;letter-spacing:.1em}
.dyage{font-size:13px;color:var(--cinnabar);margin-top:2px}
.dyyr{font-size:11px;color:var(--ink2)}
/* 紫微命盤 4x4 */
.chartwrap{overflow-x:auto}
.chart{
  display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));grid-template-rows:repeat(4,minmax(150px,auto));
  gap:0;border:2px solid var(--ink);background:var(--ink);min-width:620px;
}
.cell{
  background:#FBF6E9;border:1px solid var(--ink);padding:8px;display:flex;flex-direction:column;
  justify-content:space-between;min-height:150px;position:relative;
}
.cell.ming{background:#F3E3C8;box-shadow:inset 0 0 0 2px var(--cinnabar)}
.cstars{display:flex;flex-wrap:wrap;gap:4px 8px;align-content:flex-start}
.star{font-size:17px;font-weight:900;letter-spacing:.05em;white-space:nowrap}
.aux{font-size:13px;color:var(--ink2);white-space:nowrap}
.seal{
  display:inline-block;font-style:normal;font-size:10px;line-height:1;color:#FBF6E9;
  padding:2px 3px;border-radius:1px;margin-left:2px;vertical-align:3px;letter-spacing:0;
}
.seal祿{background:var(--wood)} .seal權{background:var(--navy)}
.seal科{background:var(--gold)} .seal忌{background:var(--cinnabar)}
.cfoot{display:flex;justify-content:space-between;align-items:flex-end;border-top:1px dashed rgba(201,188,156,.7);padding-top:5px;margin-top:6px}
.pname{font-size:15px;font-weight:700;color:var(--navy);letter-spacing:.1em}
.pname em{font-style:normal;font-size:10px;color:#FBF6E9;background:var(--navy);padding:1px 3px;border-radius:1px;margin-left:3px;vertical-align:2px}
.cell.ming .pname{color:var(--cinnabar)}
.dx{font-size:11px;color:var(--ink2)}
.gz{font-size:13px;color:var(--gold);font-weight:700}
/* 中宮資訊改以基本資料卡呈現,命盤中央四格留空由 grid 自然處理(無 5,6,7,10 中央位,本盤為外圈12宮 + 中央2x2) */
.chart::after{
  content:"紫微斗數・命盤";grid-row:2/4;grid-column:2/4;background:#FBF6E9;
  display:flex;align-items:center;justify-content:center;font-size:22px;letter-spacing:.5em;text-indent:.5em;
  color:rgba(90,82,72,.5);border:1px solid var(--ink);font-weight:700;
}
/* 十二宮詳解 */
details{border:1px solid var(--line);border-radius:2px;background:#FFFDF5;margin-bottom:8px}
summary{
  cursor:pointer;padding:10px 14px;font-weight:700;letter-spacing:.08em;color:var(--navy);
  list-style:none;position:relative;
}
summary::before{content:"❖";color:var(--cinnabar);margin-right:8px;font-size:12px}
summary::-webkit-details-marker{display:none}
details[open] summary{border-bottom:1px dashed var(--line)}
.pbody{padding:10px 16px 14px;font-size:15px}
.pbody p{margin:6px 0}
/* 流年 */
.lnctrl{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.ln-mini h4{margin:14px 0 6px;color:var(--navy);letter-spacing:.15em}
.mini{font-size:13.5px;color:var(--ink2)}
/* 合婚 */
.score{text-align:center;margin:8px 0 12px}
.scnum{
  font-size:64px;font-weight:900;color:var(--cinnabar);line-height:1;
  text-shadow:2px 2px 0 rgba(140,114,66,.25);
}
.sclabel{letter-spacing:.5em;text-indent:.5em;color:var(--ink2);font-size:14px;margin-top:4px}
.verdict{text-align:center;font-size:18px;font-weight:700;color:var(--navy);margin-bottom:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:680px){.duo{grid-template-columns:1fr}}
.duo h3{font-size:16px;color:var(--cinnabar);letter-spacing:.2em;margin-bottom:8px}
/* 取名 */
.nmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin:12px 0}
.nmcard{border:1px solid var(--line);background:#FFFDF5;border-radius:2px;padding:12px;text-align:center}
.nmname{font-size:24px;font-weight:900;letter-spacing:.15em}
.nmel{font-size:13px;color:var(--cinnabar);margin:3px 0}
.nmgl{font-size:12.5px;color:var(--ink2);line-height:1.6}
/* 段落 */
#res-bazitext p,#res-liunian p,#hh-out p{margin:7px 0;font-size:15.5px}
/* 亮度・十二神 */
sup.br{font-size:9px;font-weight:400;margin-left:1px;vertical-align:super}
.br廟,.br旺{color:var(--wood)} .br得,.br利{color:var(--gold)}
.br平,.br閒{color:var(--ink2)} .br陷{color:var(--cinnabar)}
.csbs{font-size:10.5px;color:var(--gold);border-top:1px dotted rgba(201,188,156,.6);padding-top:3px;margin-top:4px;letter-spacing:.05em}
/* 格局 */
.patrow{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.patchip{
  display:inline-block;border:1.5px solid var(--cinnabar);color:var(--cinnabar);
  padding:3px 12px;font-weight:700;letter-spacing:.15em;font-size:15px;border-radius:2px;
  background:rgba(169,59,42,.05);
}
.patname{color:var(--navy)}
#res-patterns p{margin:7px 0;font-size:15.5px}
/* 五格 */
.gerow{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0}
.ge{font-size:11px;padding:2px 5px;border-radius:1px;border:1px solid var(--line);color:var(--ink2)}
.ge i{font-style:normal;font-weight:700;margin-left:2px}
.ge吉 i{color:var(--wood)} .ge半 i{color:var(--gold)} .ge凶 i{color:var(--cinnabar)}
.nmzo{font-size:11.5px;color:var(--navy);margin-top:4px;line-height:1.5}
.nmgrid2{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
/* v3:神煞/空亡/警示/分節標題 */
.ssrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.sschip{display:inline-block;border:1px solid var(--gold);color:var(--gold);padding:3px 10px;font-size:13.5px;border-radius:2px;background:rgba(140,114,66,.06)}
.sschip small{color:var(--ink2);margin-left:5px;font-size:11px}
.kwchip{border-color:var(--navy);color:var(--navy);background:rgba(46,75,99,.05)}
.warnbox{margin-top:12px;border:1.5px solid var(--cinnabar);background:rgba(169,59,42,.06);color:var(--cinnabar);padding:10px 14px;font-size:14.5px;border-radius:2px;line-height:1.7}
h4.sec{color:var(--cinnabar);letter-spacing:.25em;font-size:16px;margin:16px 0 6px;padding-left:10px;border-left:3px solid var(--cinnabar)}
h4.sec:first-child{margin-top:2px}
.hua祿{color:var(--wood)} .hua權{color:var(--navy)} .hua科{color:var(--gold)} .hua忌{color:var(--cinnabar)}
/* 頁尾 */
footer{text-align:center;margin-top:44px;color:var(--ink2);font-size:13px;letter-spacing:.1em}
footer .stamp{
  display:inline-block;border:2px solid var(--cinnabar);color:var(--cinnabar);
  padding:4px 10px;font-size:13px;letter-spacing:.3em;text-indent:.3em;margin-bottom:10px;
  transform:rotate(-2deg);font-weight:700;
}
@media(max-width:560px){
  .card{padding:18px 14px}
  .frow label{min-width:100%}
  .pillars .big{font-size:24px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="deco">線上排盤・命理解說</div>
  <h1>紫微<span class="dot">・</span>八字命館</h1>
  <div class="sub">天文曆算排盤|斗數十二宮|四柱大運流年|合婚・取名</div>
</header>

<nav class="tabs">
  <button class="tabbtn on" data-t="tab-pan">排盤解命</button>
  <button class="tabbtn" data-t="tab-hh">合八字</button>
  <button class="tabbtn" data-t="tab-nm">取名建議</button>
</nav>

<!-- ===== 排盤 ===== -->
<section id="tab-pan" class="tab">
  <div class="card">
    <h2>輸入生辰</h2>
    <div class="frow">
      <label>出生日期</label>
      <select id="p1-y"></select>
      <select id="p1-m"></select>
      <select id="p1-d"></select>
    </div>
    <div class="frow">
      <label>出生時間</label>
      <select id="p1-h"></select>
      <select id="p1-min">
        <option value="0">00分</option><option value="10">10分</option><option value="20">20分</option>
        <option value="30">30分</option><option value="40">40分</option><option value="50">50分</option>
      </select>
    </div>
    <div class="frow">
      <label>性別</label>
      <span class="gender">
        <label><input type="radio" name="p1g" value="m" checked>男</label>
        <label><input type="radio" name="p1g" value="f">女</label>
      </span>
      <input type="hidden" id="p1-g" value="m">
    </div>
    <div class="btnrow"><button class="btn" id="btn-pan">排　盤</button></div>
    <p class="note">※ 以國曆(西元)輸入;系統依天文曆算自動換算農曆與節氣。晚子時(23:00 後)依傳統換日柱。</p>
  </div>

  <div id="result" class="hide">
    <div class="card"><h2>基本命造</h2><div id="res-basic"></div></div>
    <div class="card"><h2>八字四柱</h2><div id="res-pillars"></div></div>
    <div class="card"><h2>五行能量</h2><div id="res-elem"></div></div>
    <div class="card"><h2>八字總論</h2><div id="res-bazitext"></div></div>
    <div class="card"><h2>大運</h2><div id="res-dayun"></div></div>
    <div class="card"><h2>紫微斗數命盤</h2><div class="chartwrap"><div id="res-chart"></div></div></div>
    <div class="card"><h2>格局與身宮</h2><div id="res-patterns"></div></div>
    <div class="card"><h2>十二宮詳解</h2><div id="res-palaces"></div></div>
    <div class="card"><h2>流年運勢</h2>
      <div class="lnctrl">
        <label>查詢年份</label>
        <input type="text" id="ln-year" size="6" inputmode="numeric">
        <button class="btn alt" id="btn-ln" style="padding:8px 22px;font-size:15px">查流年</button>
      </div>
      <div id="res-liunian"></div>
    </div>
  </div>
</section>

<!-- ===== 合八字 ===== -->
<section id="tab-hh" class="tab hide">
  <div class="card">
    <h2>雙方生辰</h2>
    <div class="duo">
      <div>
        <h3>甲方</h3>
        <div class="frow"><select id="h1-y"></select><select id="h1-m"></select><select id="h1-d"></select></div>
        <div class="frow"><select id="h1-h"></select>
          <select id="h1-min"><option value="0">00分</option><option value="30">30分</option></select>
        </div>
        <div class="frow"><span class="gender">
          <label><input type="radio" name="h1g" value="m" checked>男</label>
          <label><input type="radio" name="h1g" value="f">女</label></span>
          <input type="hidden" id="h1-g" value="m">
        </div>
      </div>
      <div>
        <h3>乙方</h3>
        <div class="frow"><select id="h2-y"></select><select id="h2-m"></select><select id="h2-d"></select></div>
        <div class="frow"><select id="h2-h"></select>
          <select id="h2-min"><option value="0">00分</option><option value="30">30分</option></select>
        </div>
        <div class="frow"><span class="gender">
          <label><input type="radio" name="h2g" value="f" checked>女</label>
          <label><input type="radio" name="h2g" value="m">男</label></span>
          <input type="hidden" id="h2-g" value="f">
        </div>
      </div>
    </div>
    <div class="btnrow"><button class="btn" id="btn-hh">合　婚</button></div>
  </div>
  <div id="hh-out" class="card hide"></div>
</section>

<!-- ===== 取名 ===== -->
<section id="tab-nm" class="tab hide">
  <div class="card">
    <h2>寶寶生辰與姓氏</h2>
    <div class="frow">
      <label>姓氏</label>
      <input type="text" id="nm-surname" size="6" placeholder="例:陳">
      <label style="min-width:auto">姓氏筆畫</label>
      <input type="text" id="nm-strokes" size="4" inputmode="numeric" placeholder="自動">
      <span class="note" style="margin:0">常見姓氏免填,罕見姓請填康熙筆畫</span>
    </div>
    <div class="frow">
      <label>出生日期</label>
      <select id="n1-y"></select><select id="n1-m"></select><select id="n1-d"></select>
    </div>
    <div class="frow">
      <label>出生時間</label>
      <select id="n1-h"></select>
      <select id="n1-min"><option value="0">00分</option><option value="30">30分</option></select>
    </div>
    <div class="frow">
      <label>性別</label>
      <span class="gender">
        <label><input type="radio" name="n1g" value="m" checked>男</label>
        <label><input type="radio" name="n1g" value="f">女</label>
      </span>
      <input type="hidden" id="n1-g" value="m">
    </div>
    <div class="btnrow"><button class="btn" id="btn-nm">取名建議</button></div>
  </div>
  <div id="nm-out" class="card hide"></div>
</section>

<footer>
  <div class="stamp">命理僅供參考</div>
  <p>排盤採天文曆算(節氣・定朔),時間以東八區計,未校真太陽時。<br>
  命由天定,運由己造;盤中所示為性情趨勢,非宿命定論。</p>
</footer>

</div>
<script>
/* 百宏命理引擎 core.js — 天文法排盤(1900–2100)
   約定:時間以東八區(台灣)計;23:00 起日柱換日;閏月上半算本月、下半算次月;未校真太陽時 */
"use strict";
const SM = {};
(function(){
const RAD = Math.PI/180;
const GAN = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const ZHI = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const SX  = ['鼠','牛','虎','兔','龍','蛇','馬','羊','猴','雞','狗','豬'];
const GAN_ELEM = ['木','木','火','火','土','土','金','金','水','水'];
const ZHI_ELEM = ['水','土','木','木','土','火','火','土','金','金','土','水'];
const ELEMS = ['木','火','土','金','水'];
// 地支藏干 [本氣,中氣,餘氣]
const HIDDEN = {

/* ---------- 天文 ---------- */
function toJD(y,m,d,hours){ // 格里曆 → JD(UT)
  if(m<=2){ y-=1; m+=12; }
  const a=Math.floor(y/100), b=2-a+Math.floor(a/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+b-1524.5+(hours||0)/24;
}
function fromJD(jd){ // JD(UT) → {y,m,d,h,min}
  const z=Math.floor(jd+0.5), f=jd+0.5-z;
  let a=z;
  if(z>=2299161){ const al=Math.floor((z-1867216.25)/36524.25); a=z+1+al-Math.floor(al/4); }
  const b=a+1524, c=Math.floor((b-122.1)/365.25), dd=Math.floor(365.25*c), e=Math.floor((b-dd)/30.6001);
  const day=b-dd-Math.floor(30.6001*e)+f;
  const m=(e<14)?e-1:e-13, y=(m>2)?c-4716:c-4715;
  const d=Math.floor(day), hf=(day-d)*24, h=Math.floor(hf), min=Math.round((hf-h)*60);
  return {y:y, m:m, d:d, h:h, min:min};
}
function deltaTdays(y){
  let dt;
  if(y>=2050){ const u=(y-1820)/100; dt=-20+32*u*u-0.5628*(2150-y); }
  else if(y>=2005){ const u=y-2000; dt=62.92+0.32217*u+0.005589*u*u; }
  else if(y>=1986){ const u=y-2000; dt=63.86+0.3345*u-0.060374*u*u+0.0017275*u*u*u+0.000651814*Math.pow(u,4)+0.00002373599*Math.pow(u,5); }
  else if(y>=1961){ const u=y-1975; dt=45.45+1.067*u-u*u/260-u*u*u/718; }
  else if(y>=1941){ const u=y-1950; dt=29.07+0.407*u-u*u/233+u*u*u/2547; }
  else if(y>=1920){ const u=y-1920; dt=21.20+0.84493*u-0.0761*u*u+0.0020936*u*u*u; }
  else if(y>=1900){ const u=y-1900; dt=-2.79+1.494119*u-0.0598939*u*u+0.0061966*u*u*u-0.000197*Math.pow(u,4); }
  else { const u=(y-1820)/100; dt=-20+32*u*u; }
  return dt/86400;
}
function sunLon(jde){
  const T=(jde-2451545)/36525;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*RAD;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*RAD;
  let lam=(L0+C-0.00569-0.00478*Math.sin(om))%360;
  return lam<0?lam+360:lam;
}
function solveTerm(targetLon, jdeGuess){
  let jde=jdeGuess;
  for(let i=0;i<12;i++){
    let diff=sunLon(jde)-targetLon;
    diff=((diff+180)%360+360)%360-180;
    if(Math.abs(diff)<1e-8) break;
    jde-=diff*365.2422/360;
  }
  return jde;
}
function newMoonJDE(k){

  let jde=2451550.09766+29.530588861*k+0.00015437*T2-0.00000015*T3+0.00000000073*T4;
  const E=1-0.002516*T-0.0000074*T2;
  const M=(2.5534+29.1053567*k-0.0000014*T2-0.00000011*T3)*RAD;
  const Mp=(201.5643+385.81693528*k+0.0107582*T2+0.00001238*T3-0.000000058*T4)*RAD;
  const F=(160.7108+390.67050284*k-0.0016118*T2-0.00000227*T3+0.000000011*T4)*RAD;
  const Om=(124.7746-1.56375588*k+0.0020672*T2+0.00000215*T3)*RAD;
  let c=-0.4072*Math.sin(Mp)+0.17241*E*Math.sin(M)+0.01608*Math.sin(2*Mp)+0.01039*Math.sin(2*F)
   +0.00739*E*Math.sin(Mp-M)-0.00514*E*Math.sin(Mp+M)+0.00208*E*E*Math.sin(2*M)
   -0.00111*Math.sin(Mp-2*F)-0.00057*Math.sin(Mp+2*F)+0.00056*E*Math.sin(2*Mp+M)
   -0.00042*Math.sin(3*Mp)+0.00042*E*Math.sin(M+2*F)+0.00038*E*Math.sin(M-2*F)
   -0.00024*E*Math.sin(2*Mp-M)-0.00017*Math.sin(Om)-0.00007*Math.sin(Mp+2*M)
   +0.00004*Math.sin(2*Mp-2*F)+0.00004*Math.sin(3*M)+0.00003*Math.sin(Mp+M-2*F)
   +0.00003*Math.sin(2*Mp+2*F)-0.00003*Math.sin(Mp+M+2*F)+0.00003*Math.sin(Mp-M+2*F)
   -0.00002*Math.sin(Mp-M-2*F)-0.00002*Math.sin(3*Mp+M)+0.00002*Math.sin(4*Mp);
  const A1=(299.77+0.107408*k-0.009173*T2)*RAD;
  c+=0.000325*Math.sin(A1)+0.000165*Math.sin((251.88+0.016321*k)*RAD)+0.000164*Math.sin((251.83+26.651886*k)*RAD)
   +0.000126*Math.sin((349.42+36.412478*k)*RAD)+0.00011*Math.sin((84.66+18.206239*k)*RAD)
   +0.000062*Math.sin((141.74+53.303771*k)*RAD)+0.00006*Math.sin((207.14+2.453732*k)*RAD)
   +0.000056*Math.sin((154.84+7.30686*k)*RAD)+0.000047*Math.sin((34.52+27.261239*k)*RAD)
   +0.000042*Math.sin((207.19+0.121824*k)*RAD)+0.00004*Math.sin((291.34+1.844379*k)*RAD)
   +0.000037*Math.sin((161.72+24.198154*k)*RAD)+0.000035*Math.sin((239.56+25.513099*k)*RAD)
   +0.000023*Math.sin((331.55+3.592518*k)*RAD);
  return jde+c;
}
// 事件(JDE,力學時)之東八區當地日序(JDN)
function evDN(jde, yApprox){ return Math.floor(jde - deltaTdays(yApprox) + 8/24 + 0.5); }
function dateDN(y,m,d){ return Math.round(toJD(y,m,d,12)); }
function dnToDate(dn){ return fromJD(dn); } // 回傳當日(正午)
function jdeToLocal(jde, yApprox){ return fromJD(jde - deltaTdays(yApprox) + 8/24); }

/* ---------- 農曆 ---------- */
function dongzhi(yy){ return solveTerm(270, toJD(yy,12,21,12)); }
// 一「歲」:自 yy 年冬至所在月 至 yy+1 年冬至所在月之前
function suiMonths(yy){
  const dz1=dongzhi(yy), dz2=dongzhi(yy+1);
  const d1=evDN(dz1,yy), d2=evDN(dz2,yy+1);
  let k=Math.round((yy-2000)*12.3685)+10;
  while(evDN(newMoonJDE(k),yy) > d1) k--;
  while(evDN(newMoonJDE(k+1),yy) <= d1) k++;
  const starts=[];
  for(let i=0;i<16;i++) starts.push(evDN(newMoonJDE(k+i), yy));
  let j=1; while(!(starts[j]<=d2 && d2<starts[j+1])) j++;
  const nMonths=j; // 本歲月數(11月起)
  const hasLeap = (nMonths===13);
  // 中氣(270,300,...每30°)日序
  const zq=[]; let t=dz1;
  for(let q=0;q<14;q++){
    const lon=(270+30*q)%360;
    const tj=solveTerm(lon, dz1+q*30.44);
    zq.push(evDN(tj, yy + (q>6?1:0)));
  }
  function hasZhongqi(i){ for(const z of zq){ if(z>=starts[i] && z<starts[i+1]) return true; } return false; }
  const months=[]; let num=11, lyear=yy, leapUsed=false;
  for(let i=0;i<nMonths;i++){
    let leap=false;
    if(i>0){
      if(hasLeap && !leapUsed && !hasZhongqi(i)){ leap=true; leapUsed=true; }
      else { num=(num%12)+1; if(num===1) lyear=yy+1; }
    }
    months.push({start:starts[i], end:starts[i+1]-1, num:num, leap:leap, lyear:lyear});
  }
  return months;
}
function lunarFromDate(y,m,d){
  const dn=dateDN(y,m,d);
  let all=[];
  for(const yy of [y-2, y-1, y]) all=all.concat(suiMonths(yy));
  for(const mo of all){
    if(dn>=mo.start && dn<=mo.end){
      return {lyear:mo.lyear, month:mo.num, day:dn-mo.start+1, leap:mo.leap, monthDays:mo.end-mo.start+1};
    }
  }
  return null;
}
const LDAY=['初一','初二','初三','初四','初五','初六','初七','初八','初九','初十','十一','十二','十三','十四','十五','十六','十七','十八','十九','二十','廿一','廿二','廿三','廿四','廿五','廿六','廿七','廿八','廿九','三十'];

/* ---------- 八字 ---------- */
function dayGZindex(y,m,d,hour){ // 23時起換日
  let jdn=dateDN(y,m,d);
  if(hour>=23) jdn+=1;
  return ((jdn-2433191)%60+60)%60; // 1949-10-01 甲子日
}
function gz(i){ return GAN[i%10]+ZHI[i%12]; }
function bazi(y,m,d,hour,min){
  min=min||0;
  const jdUT=toJD(y,m,d,hour+min/60-8);
  const jde=jdUT+deltaTdays(y);
  const lam=sunLon(jde);
  // 年柱:以立春為界
  const lichun=solveTerm(315, toJD(y,2,4,0));
  const by=(jde<lichun)?y-1:y;
  const yG=((by-4)%10+10)%10, yZ=((by-4)%12+12)%12;
  // 月柱:依太陽黃經
  const mi=Math.floor((((lam-315)%360)+360)%360/30); // 0=寅月
  const mZ=(mi+2)%12;
  const mG=(((yG%5)*2+2)+mi)%10;
  // 日柱
  const dIdx=dayGZindex(y,m,d,hour);
  const dG=dIdx%10, dZ=dIdx%12;
  // 時柱
  const hZ=Math.floor((hour+1)/2)%12;
  const hG=(((dG%5)*2)+hZ)%10;
  // 大運
  const yangYear=(yG%2===0), male=null; // 方向由呼叫端依性別決定
  const monthStartLon=(315+mi*30)%360;
  const nextLon=(monthStartLon+30)%360, prevLon=monthStartLon;
  const tNext=solveTerm(nextLon, jde+(((nextLon-lam)%360+360)%360)/360*365.2422);
  const tPrev=solveTerm(prevLon, jde-(((lam-prevLon)%360+360)%360)/360*365.2422);
  return {
    y:y,m:m,d:d,hour:hour,min:min, jde:jde, lam:lam,
    pillars:{ year:[yG,yZ], month:[mG,mZ], day:[dG,dZ], hour:[hG,hZ] },
    yangYear:yangYear, byear:by,
    daYunInfo:{ tNext:tNext, tPrev:tPrev }
  };
}
function daYun(bz, gender){ // gender: 'm'/'f'
  const forward=(bz.yangYear && gender==='m')||(!bz.yangYear && gender==='f');
  const days=forward?(bz.daYunInfo.tNext-bz.jde):(bz.jde-bz.daYunInfo.tPrev);
  const startYears=days/3;
  const sy=Math.floor(startYears), smo=Math.round((startYears-sy)*12);
  const mIdx=bz.pillars.month[0]%10*6===0?0:0; // 佔位
  let mi60=-1;
  for(let i=0;i<60;i++){ if(i%10===bz.pillars.month[0] && i%12===bz.pillars.month[1]){ mi60=i; break; } }
  const list=[];
  for(let n=1;n<=10;n++){
    const idx=((mi60+(forward?n:-n))%60+60)%60;
    const ageS=Math.round(startYears)+(n-1)*10;
    list.push({gz:gz(idx), g:idx%10, z:idx%12, ageFrom:ageS+1, ageTo:ageS+10, yearFrom:bz.byear+ageS, yearTo:bz.byear+ageS+9});
  }
  return {forward:forward, startYears:startYears, sy:sy, smo:smo, list:list};
}
// 十神
const TEN_GOD=['比肩','劫財','食神','傷官','偏財','正財','七殺','正官','偏印','正印'];
function tenGod(dayG, otherG){
  const de=GAN_ELEM[dayG], oe=GAN_ELEM[otherG];
  const same=(dayG%2)===(otherG%2);
  const rel=(ELEMS.indexOf(oe)-ELEMS.indexOf(de)+5)%5; // 0同 1我生 2我克 3克我 4生我
  const base=[0,2,4,6,8][rel];
  return TEN_GOD[base+(same?0:1)];
}
function fiveElemStats(bz){
  const score={'木':0,'火':0,'土':0,'金':0,'水':0};
  const P=bz.pillars;
  [P.year[0],P.month[0],P.hour[0]].forEach(g=>{ score[GAN_ELEM[g]]+=1; });
  score[GAN_ELEM[P.day[0]]]+=0.5;
  const W=[['year',1],['month',1.8],['day',1],['hour',1]];
  for(const [k,w] of W){
    const hs=HIDDEN[ZHI[P[k][1]]];
    hs.forEach((hg,i)=>{ const gi=GAN.indexOf(hg); score[GAN_ELEM[gi]]+=w*[1,0.5,0.3][i]; });
  }
  const de=GAN_ELEM[P.day[0]];
  const idx=ELEMS.indexOf(de);
  const sheng=ELEMS[(idx+4)%5]; // 生我
  const self=score[de]+score[sheng];
  let total=0; for(const e of ELEMS) total+=score[e];
  const ratio=self/total;
  const strong=ratio>=0.45;
  const xiyong= strong? [ELEMS[(idx+1)%5],ELEMS[(idx+2)%5],ELEMS[(idx+3)%5]] : [ELEMS[(idx+4)%5],de];
  return {score:score, dayElem:de, ratio:ratio, strong:strong, xiyong:xiyong};
}
/* ---------- 紫微斗數 ---------- */
const STARS_MAIN=['紫微','天機','太陽','武曲','天同','廉貞','天府','太陰','貪狼','巨門','天相','天梁','七殺','破軍'];
const PALACE_NAMES=['命宮','兄弟宮','夫妻宮','子女宮','財帛宮','疾厄宮','遷移宮','交友宮','官祿宮','田宅宮','福德宮','父母宮'];
const SIHUA={ // 年干 → [祿,權,科,忌]
 0:['廉貞','破軍','武曲','太陽'], 1:['天機','天梁','紫微','太陰'], 2:['天同','天機','文昌','廉貞'],
 3:['太陰','天同','天機','巨門'], 4:['貪狼','太陰','右弼','天機'], 5:['武曲','貪狼','天梁','文曲'],
 6:['太陽','武曲','太陰','天同'], 7:['巨門','太陽','文曲','文昌'], 8:['天梁','紫微','左輔','武曲'],
 9:['破軍','巨門','太陰','貪狼'] };
const MINGZHU={0:'貪狼',1:'巨門',2:'祿存',3:'文曲',4:'廉貞',5:'武曲',6:'破軍',7:'武曲',8:'廉貞',9:'文曲',10:'祿存',11:'巨門'};
const SHENZHU={0:'火星',1:'天相',2:'天梁',3:'天同',4:'文昌',5:'天機',6:'鈴星',7:'天相',8:'天梁',9:'天同',10:'文昌',11:'天機'};
function ziwei(lunar, hourZhi, yearG, yearZ, gender){
  // 閏月:上半算本月,下半算次月
  let lm=lunar.month;
  if(lunar.leap && lunar.day>15) lm=lm%12+1;
  const mingZhi=((2+(lm-1)-hourZhi)%12+12)%12;
  const shenZhi=((2+(lm-1)+hourZhi)%12+12)%12;
  // 宮干:五虎遁
  const ganAt=b=>(((yearG%5)*2+2)+((b-2+12)%12))%10;
  // 五行局:命宮干支納音
  const mg=ganAt(mingZhi);
  let m60=-1; for(let i=0;i<60;i++){ if(i%10===mg && i%12===mingZhi){ m60=i; break; } }
  const nayin=NAYIN[Math.floor(m60/2)];
  const ne=['金','火','木','土','水'].find(e=>nayin.indexOf(e)>=0);
  const JU={'水':2,'木':3,'金':4,'土':5,'火':6}[ne];
  // 安紫微
  const dday=lunar.day;
  const q=Math.ceil(dday/JU), r=JU*q-dday;
  let zw=(2+(q-1))%12;
  zw=((r%2===1)?(zw-r):(zw+r));
  zw=((zw%12)+12)%12;
  const pos={}; STARS_MAIN.forEach(s=>pos[s]=-1);
  pos['紫微']=zw;
  pos['天機']=(zw+11)%12; pos['太陽']=(zw+9)%12; pos['武曲']=(zw+8)%12;
  pos['天同']=(zw+7)%12; pos['廉貞']=(zw+4)%12;
  const tf=((4-zw)%12+12)%12;
  pos['天府']=tf; pos['太陰']=(tf+1)%12; pos['貪狼']=(tf+2)%12; pos['巨門']=(tf+3)%12;
  pos['天相']=(tf+4)%12; pos['天梁']=(tf+5)%12; pos['七殺']=(tf+6)%12; pos['破軍']=(tf+10)%12;
  // 輔煞雜曜
  const aux={};
  aux['左輔']=(4+lm-1)%12; aux['右弼']=((10-(lm-1))%12+12)%12;
  aux['文昌']=((10-hourZhi)%12+12)%12; aux['文曲']=(4+hourZhi)%12;
  const KUI={0:1,1:0,2:11,3:11,4:1,5:0,6:1,7:6,8:3,9:3}, YUE={0:7,1:8,2:9,3:9,4:7,5:8,6:7,7:2,8:5,9:5};
  aux['天魁']=KUI[yearG]; aux['天鉞']=YUE[yearG];
  const LU={0:2,1:3,2:5,3:6,4:5,5:6,6:8,7:9,8:11,9:0};
  aux['祿存']=LU[yearG]; aux['擎羊']=(LU[yearG]+1)%12; aux['陀羅']=(LU[yearG]+11)%12;
  const grp=[8,5,2,11].findIndex(z=>[z,(z+4)%12,(z+8)%12].includes(yearZ)); // 申子辰0 巳酉丑1 寅午戌2 亥卯未3
  const HUO=[2,3,1,9][grp], LING=[10,10,3,10][grp];
  aux['火星']=(HUO+hourZhi)%12; aux['鈴星']=(LING+hourZhi)%12;
  aux['地劫']=(11+hourZhi)%12; aux['地空']=((11-hourZhi)%12+12)%12;
  aux['天馬']=[2,11,8,5][grp];
  aux['紅鸞']=((3-yearZ)%12+12)%12; aux['天喜']=(aux['紅鸞']+6)%12;
  aux['天姚']=(1+lm-1)%12; aux['天刑']=(9+lm-1)%12;
  // 宮位
  const palaces=[];
  for(let i=0;i<12;i++){
    const zhi=i;
    const off=((mingZhi-zhi)%12+12)%12; // 逆布
    palaces.push({zhi:zhi, gan:ganAt(zhi), name:PALACE_NAMES[off], stars:[], aux:[], isShen:(zhi===shenZhi)});
  }
  for(const s of STARS_MAIN) palaces[pos[s]].stars.push(s);
  for(const a in aux) palaces[aux[a]].aux.push(a);
  // 四化(生年)
  const sh=SIHUA[yearG], HUA=['祿','權','科','忌'];
  const sihua={}; sh.forEach((s,i)=>sihua[s]=HUA[i]);
  // 大限:起於命宮,局數歲起,陽男陰女順行
  const forward=((yearG%2===0)&&gender==='m')||((yearG%2===1)&&gender==='f');
  for(let n=0;n<12;n++){
    const zhi=((mingZhi+(forward?n:-n))%12+12)%12;
    palaces[zhi].daxian=[JU+n*10, JU+n*10+9];
  }
  return {mingZhi:mingZhi, shenZhi:shenZhi, ju:JU+'局('+ne+')', juNum:JU, nayin:nayin,
    pos:pos, aux:aux, palaces:palaces, sihua:sihua, forward:forward,
    mingzhu:MINGZHU[mingZhi], shenzhu:SHENZHU[yearZ], useMonth:lm};

  if(stars.length===0){ opp=zw.palaces[(p.zhi+6)%12]; stars=opp.stars; borrowed=true; }
  const segs=[];
  segs.push('【'+p.name+'】('+SM.GAN[p.gan]+SM.ZHI[p.zhi]+(p.isShen?'・身宮':'')+') '+TX.PALACE[p.name]+'。');
  if(borrowed) segs.push('本宮無主星,借對宮('+(opp?opp.name:'')+')星曜參看,主受對宮影響深、彈性大:');
  for(const s of stars){
    const t=TX.STAR[s];
    let body=t.b;
    if(p.name==='命宮') body=t.m;
    else if(p.name==='官祿宮') body=t.c;
    else if(p.name==='財帛宮') body=t.w;
    else if(p.name==='夫妻宮') body=t.l;
    let hua = (!borrowed && zw.sihua[s])? '〔化'+zw.sihua[s]+'〕':'';
    segs.push('★'+s+hua+':'+body+(hua?(' '+TX.HUA[zw.sihua[s]]+'。'):''));
  }
  if(p.aux.length) segs.push('輔曜:'+p.aux.map(a=>a+'('+TX.AUX[a]+')').join(';')+'。');
  return segs;
};
TX.liunianText=function(SM,year,bz,zw,age){
  const yG=((year-4)%10+10)%10, yZ=((year-4)%12+12)%12;
  const dG=bz.pillars.day[0], dZ=bz.pillars.day[1], bz_yZ=bz.pillars.year[1];
  const out=[];
  out.push(year+'年歲次'+SM.GAN[yG]+SM.ZHI[yZ]+'('+SM.SX[yZ]+'年),虛歲'+age+'。');
  // 八字面
  const tg=SM.tenGod(dG,yG);
  let b='八字流年:流年天干'+SM.GAN[yG]+'為日主之「'+tg+'」,'+'此年主題圍繞'+TX.TENGOD[tg]+'。';
  const R=SM.rel;
  if(R.isChong(yZ,dZ)) b+='流年支沖日支(歲運併臨之沖),婚姻感情、合夥關係與居住環境易生變動,凡事宜守不宜攻。';
  else if(R.isChong(yZ,bz_yZ)) b+='流年沖太歲(本命年對沖),整體變動大,宜安太歲、多行善穩氣場。';
  else if(yZ===bz_yZ) b+='本命年值太歲,運勢起伏明顯,宜低調行事、避免重大冒險。';
  else if(R.isLiuhe(yZ,dZ)) b+='流年支與日支六合,人際婚戀和合,談判合作易成,屬安順之年。';
  else if(R.isSanhe(yZ,dZ)) b+='流年支與日支三合,貴人運旺,推展事務順遂。';
  else if(R.isXing(yZ,dZ)) b+='流年支刑日支,易有口舌糾紛、文書官非,簽約用印務必謹慎。';
  else if(R.isHai(yZ,dZ)) b+='流年支害日支,防小人暗損,合作對象需細察。';
  else b+='流年支與命局無明顯沖剋,屬平穩推進之年。';
  out.push(b);
  // 紫微面
  const lp=zw.palaces[yZ];
  const sh=SM.SIHUA[yG];

  const find=s=>{ for(const p of zw.palaces){ if(p.stars.includes(s)||p.aux.includes(s)) return p.name; } return null; };
  const lu=find(sh[0]), ji=find(sh[3]);
  if(lu) z+='流年化祿星「'+sh[0]+'」坐本命'+lu+',該方面進財得意、機緣最旺;';
  if(ji) z+='流年化忌星「'+sh[3]+'」落本命'+ji+',該領域為今年壓力與課題所在,宜謹慎經營。';
  out.push(z);
  return out;
};
TX.hehun=function(SM,b1,b2){
  const R=SM.rel;
  let score=60; const notes=[];
  const d1=b1.pillars.day, d2=b2.pillars.day, y1=b1.pillars.year, y2=b2.pillars.year;
  if(R.ganHe(d1[0],d2[0])){ score+=15; notes.push('✦ 兩人日柱天干相合('+SM.GAN[d1[0]]+SM.GAN[d2[0]]+'合),夫妻宮位天然相吸,心性投契,此為合婚上格。'); }
  else { const e1=SM.GAN_ELEM[d1[0]], e2=SM.GAN_ELEM[d2[0]];
    const r=(SM.ELEMS.indexOf(e2)-SM.ELEMS.indexOf(e1)+5)%5;
    if(r===1||r===4){ score+=8; notes.push('✦ 日主五行相生('+e1+e2+'),一方滋養一方,相處互補有情。'); }
    else if(r===2||r===3){ score-=5; notes.push('✧ 日主五行相剋('+e1+'剋'+e2+'或反之),個性需磨合,懂退讓則無妨。'); }
    else notes.push('✦ 日主五行比和,習性相近,如友如伴。'); }
  if(R.isLiuhe(d1[1],d2[1])){ score+=15; notes.push('✦ 日支六合——日支為夫妻宮,六合主恩愛黏膩,婚配吉象。'); }
  else if(R.isSanhe(d1[1],d2[1])){ score+=10; notes.push('✦ 日支三合,價值觀契合,合作互助之配。'); }
  else if(R.isChong(d1[1],d2[1])){ score-=15; notes.push('✧ 日支相沖,夫妻宮對沖,相處易有拉鋸,宜聚少離多、各留空間化解。'); }
  else if(R.isXing(d1[1],d2[1])){ score-=8; notes.push('✧ 日支相刑,易互相挑剔,溝通需講方法。'); }
  else if(R.isHai(d1[1],d2[1])){ score-=6; notes.push('✧ 日支相害,防瑣事積怨,凡事說開為上。'); }
  if(R.isLiuhe(y1[1],y2[1])){ score+=8; notes.push('✦ 生肖六合('+SM.SX[y1[1]]+SM.SX[y2[1]]+'),長輩緣與家庭融合度佳。'); }
  else if(R.isSanhe(y1[1],y2[1])){ score+=6; notes.push('✦ 生肖三合,家運相幫。'); }
  else if(R.isChong(y1[1],y2[1])){ score-=10; notes.push('✧ 生肖對沖('+SM.SX[y1[1]]+SM.SX[y2[1]]+'),傳統視為大沖,實務上以日柱為重,沖者主聚少離多,未必為凶。'); }
  const s1=SM.fiveElemStats(b1), s2=SM.fiveElemStats(b2);
  const help2to1=s1.xiyong.some(e=>s2.score[e]>=2), help1to2=s2.xiyong.some(e=>s1.score[e]>=2);
  if(help2to1&&help1to2){ score+=12; notes.push('✦ 五行互補:雙方命局正好補足彼此喜用之氣,愈處愈旺,是合八字最看重的「相生互旺」。'); }
  else if(help2to1||help1to2){ score+=6; notes.push('✦ 五行單向補益:一方為另一方的「貴人型」伴侶,旺其運勢。'); }
  else notes.push('✧ 五行補益平平,婚姻吉凶端看經營,命理只佔三分。');
  score=Math.max(20,Math.min(98,score));
  let verdict;
  if(score>=85) verdict='天作之合——干支多合少沖,五行互補,屬上等婚配。';
  else if(score>=70) verdict='良緣可期——合多於沖,基礎穩固,小磨合不礙大局。';
  else if(score>=55) verdict='中平之配——有合有沖,成敗在經營,婚前多了解、婚後多包容。';
  else verdict='沖剋偏多——並非不能成,而是相處模式需刻意設計(如聚少離多、分工明確),化沖為動力。';
  return {score:score, verdict:verdict, notes:notes};
};
TX.naming=function(SM,surname,gender,xiyong){
  const pool1=TX.NAME_POOL[xiyong[0]]||[], pool2=TX.NAME_POOL[xiyong[1]||xiyong[0]]||pool1;
  const picks=[]; const used=new Set();
  let i=0,j=Math.floor(pool2.length/2);
  while(picks.length<8 && i<pool1.length){
    const a=pool1[i%pool1.length], b=pool2[j%pool2.length];
    const nm=a[0]+b[0];
    if(!used.has(nm)&&a[0]!==b[0]){ used.add(nm);
      picks.push({name:surname+nm, gloss:a[0]+'('+a[1]+')+'+b[0]+'('+b[1]+')', elems:xiyong[0]+(xiyong[1]?('+'+xiyong[1]):'')});
    }
    i++; j+=3;
  }
  return picks;
};

"use strict";
(function(){
// 廟旺利陷(十四主星,索引=地支 子0..亥11;採《全書》通行版本)
const MIAO={
'紫微':'平廟廟旺得旺廟廟旺平得旺','天機':'廟陷得旺利平廟陷得旺利平',
'太陽':'陷陷旺廟旺旺廟得得平陷陷','武曲':'旺廟得陷廟平旺廟得旺廟平',
'天同':'旺陷利廟平廟陷陷旺平平廟','廉貞':'平利廟平利陷平廟廟平利陷',
'天府':'廟廟廟得廟得旺廟得旺廟得','太陰':'廟廟旺陷閒陷陷平利旺旺廟',
'貪狼':'旺廟平利廟陷旺廟平利廟陷','巨門':'旺旺廟廟平平旺陷廟廟旺旺',
'天相':'廟廟廟陷得得旺得廟平得平','天梁':'廟旺廟廟廟陷廟旺陷得廟陷',
'七殺':'旺廟廟陷旺平旺廟廟閒廟平','破軍':'廟旺得陷旺平廟旺得陷旺平'};
SM.bright=function(star,zhi){ const t=MIAO[star]; return t?t[zhi]:''; };

const CS12=['長生','沐浴','冠帶','臨官','帝旺','衰','病','死','墓','絕','胎','養'];
const BS12=['博士','力士','青龍','小耗','將軍','奏書','飛廉','喜神','病符','大耗','伏兵','官府'];
SM.CS12=CS12; SM.BS12=BS12;

// 三方四正:本宮、對宮、兩個三合宮
SM.sanfang=function(zhi){ return [zhi,(zhi+4)%12,(zhi+6)%12,(zhi+8)%12]; };

// 擴充安星(就地修改 zw):o={yG,yZ,hZ,day,month}
SM.ziweiExt=function(zw,o){
  const P=zw.palaces, fw=zw.forward;
  // ---- 長生十二神(依五行局起長生,陽男陰女順行) ----
  const csStart={2:8,3:11,4:5,5:8,6:2}[zw.juNum];
  for(let i=0;i<12;i++){
    const z=((csStart+(fw?i:-i))%12+12)%12;
    P[z].cs=CS12[i];
  }
  // ---- 博士十二神(起祿存,陽男陰女順行) ----
  const lc=zw.aux['祿存'];
  if(lc!==undefined) for(let i=0;i<12;i++){
    const z=((lc+(fw?i:-i))%12+12)%12;
    P[z].bs=BS12[i];
  }
  // ---- 增補雜曜 ----
  const g=o.yG, y=o.yZ, h=o.hZ, d=o.day;
  const put=(name,z)=>{ z=((z%12)+12)%12; P[z].aux.push(name); zw.aux[name]=z; };
  put('天官',[7,4,5,2,3,9,11,9,10,6][g]);
  put('天福',[9,8,0,11,3,2,6,5,6,5][g]);
  put('天廚',[5,6,0,5,6,8,2,6,9,11][g]);
  put('天哭',(6-y+12)%12); put('天虛',(6+y)%12);
  put('龍池',(4+y)%12);   put('鳳閣',(10-y+12)%12);
  const gu=[[2,10],[2,10],[5,1],[5,1],[5,1],[8,4],[8,4],[8,4],[11,7],[11,7],[11,7],[2,10]][y];
  put('孤辰',gu[0]); put('寡宿',gu[1]);
  put('蜚廉',[8,9,10,5,6,7,2,3,4,11,0,1][y]);
  put('破碎',[5,1,9,5,1,9,5,1,9,5,1,9][y]);
  put('台輔',(6+h)%12); put('封誥',(2+h)%12);
  if(zw.aux['左輔']!==undefined) put('三台',zw.aux['左輔']+d-1);
  if(zw.aux['右弼']!==undefined) put('八座',zw.aux['右弼']-(d-1));
  if(zw.aux['文昌']!==undefined) put('恩光',zw.aux['文昌']+d-2);
  if(zw.aux['文曲']!==undefined) put('天貴',zw.aux['文曲']+d-2);
  put('天才',zw.mingZhi+y); put('天壽',zw.shenZhi+y);
  // ---- 格局判定 ----
  zw.patterns=detectPatterns(zw);
  return zw;
};

function starsIn(zw,zhis){
  const s=new Set();
  zhis.forEach(z=>{ zw.palaces[z].stars.forEach(x=>s.add(x)); zw.palaces[z].aux.forEach(x=>s.add(x)); });
  return s;
}
function detectPatterns(zw){
  const m=zw.mingZhi, sf=SM.sanfang(m);
  const ming=new Set(zw.palaces[m].stars), mingAux=new Set(zw.palaces[m].aux);
  const tri=starsIn(zw,sf);
  const has=(set,...xs)=>xs.every(x=>set.has(x));
  const out=[];
  if(has(ming,'紫微','天府')) out.push('紫府同宮');
  if(has(ming,'紫微','貪狼')&&(m===3||m===9)) out.push('極居卯酉');
  if(has(tri,'天機','太陰','天同','天梁')) out.push('機月同梁');
  if((ming.has('七殺')||ming.has('破軍')||ming.has('貪狼'))&&has(tri,'七殺','破軍','貪狼')) out.push('殺破狼');
  if(!ming.has('天府')&&!ming.has('天相')&&has(tri,'天府','天相')) out.push('府相朝垣');
  if(has(tri,'太陽','天梁','文昌','祿存')) out.push('陽梁昌祿');
  if(ming.has('太陽')&&m===3) out.push('日照雷門');
  if(ming.has('太陰')&&m===11) out.push('月朗天門');
  if(has(ming,'太陽','太陰')) out.push('日月同臨');
  if(tri.has('太陽')&&tri.has('太陰')&&SM.bright('太陽',findStar(zw,'太陽'))==='陷'&&SM.bright('太陰',findStar(zw,'太陰'))==='陷') out.push('日月反背');
  if(has(ming,'天機','巨門')&&(m===3||m===9)) out.push('巨機同臨');
  if(ming.has('巨門')&&(m===0||m===6)) out.push('石中隱玉');
  if(tri.has('貪狼')&&tri.has('火星')) out.push('火貪格');
  if(tri.has('貪狼')&&tri.has('鈴星')) out.push('鈴貪格');
  if(tri.has('天馬')&&(tri.has('祿存')||zw.sihua['化祿']!==undefined&&triHasHuaLu(zw,sf))) out.push('祿馬交馳');
  if(tri.has('文昌')&&tri.has('文曲')) out.push('文星拱命');
  if(has(mingAux,'左輔','右弼')) out.push('左右同宮');
  if(tri.has('天魁')&&tri.has('天鉞')) out.push('魁鉞拱命');
  return out;
}
function findStar(zw,s){
  for(let z=0;z<12;z++) if(zw.palaces[z].stars.includes(s)) return z;
  return 0;
}
function triHasHuaLu(zw,sf){
  // 化祿之星是否在三方四正
  let luStar=null; for(const s in zw.sihua){ if(zw.sihua[s]==='祿') luStar=s; }
  if(!luStar) return false;
  return sf.some(z=>zw.palaces[z].stars.includes(luStar)||zw.palaces[z].aux.includes(luStar));
}
})();

          next:{name:JIE_NAMES[(mi+1)%12],min:Math.round((nextJde-jdeT)*1440)}};
};
})();

function wealthText(g,st,cnt,ss){

/* ===== 詳細版紫微宮位解說 ===== */
TX.ziweiPalaceText2=function(SM,zw,p){
  let stars=p.stars, borrowed=false, opp=null;
  if(stars.length===0){ opp=zw.palaces[(p.zhi+6)%12]; stars=opp.stars; borrowed=true; }
  const segs=[];
  segs.push('【'+p.name+'】('+SM.GAN[p.gan]+SM.ZHI[p.zhi]+(p.isShen?'・身宮':'')+') '+TX.PALACE[p.name]+'。');
  segs.push(TX.PALACE_DETAIL[p.name]||'');
  if(p.isShen&&p.name!=='命宮'&&TX.SHENGONG_T[p.name]) segs.push('※ '+TX.SHENGONG_T[p.name]);
  if(borrowed) segs.push('本宮無主星,借對宮('+(opp?opp.name:'')+')星曜參看。無主星之宮並非空白,而是主「彈性與外塑」——此領域的樣貌深受對宮與環境影響,可塑性大,逢吉則吉、逢煞則凶,起伏較有主星者明顯:');
  for(const s of stars){
    const t=TX.STAR[s];
    let body=t.b;
    if(p.name==='命宮') body=t.m;
    else if(p.name==='官祿宮') body=t.c;
    else if(p.name==='財帛宮') body=t.w;
    else if(p.name==='夫妻宮') body=t.l;
    const br=borrowed?SM.bright(s,(p.zhi+6)%12):SM.bright(s,p.zhi);
    const hua=(!borrowed&&zw.sihua[s])?zw.sihua[s]:null;
    let seg='★'+s+(br?'('+br+')':'')+(hua?'〔化'+hua+'〕':'')+':'+body;
    if(br&&TX.BRIGHT_MOD[br]) seg+=' '+TX.BRIGHT_MOD[br];
    if(hua) seg+=' '+TX.HUA[hua]+'。';
    segs.push(seg);
  }
  // 輔曜分組評述
  if(p.aux.length){
    const JI=['左輔','右弼','文昌','文曲','天魁','天鉞','祿存','天馬'];
    const SHA=['擎羊','陀羅','火星','鈴星','地空','地劫'];
    const TAO=['紅鸞','天喜','天姚'];
    const ji=p.aux.filter(a=>JI.indexOf(a)>=0), sha=p.aux.filter(a=>SHA.indexOf(a)>=0),
          tao=p.aux.filter(a=>TAO.indexOf(a)>=0),
          misc=p.aux.filter(a=>JI.indexOf(a)<0&&SHA.indexOf(a)<0&&TAO.indexOf(a)<0);
    if(ji.length) segs.push('吉曜入宮('+ji.join('、')+'):'+ji.map(a=>a+'——'+(TX.AUX[a]||TX.AUX2[a]||'')).join(';')+'。吉星拱護,此領域多助力、少阻礙,逢困有解。');
    if(sha.length) segs.push('煞曜入宮('+sha.join('、')+'):'+sha.map(a=>a+'——'+(TX.AUX[a]||TX.AUX2[a]||'')).join(';')+'。煞星非全然為惡,主此領域多波折磨練、得來不易;能受其礪者,成就反而紮實。');
    if(tao.length) segs.push('桃花星曜('+tao.join('、')+'):'+tao.map(a=>a+'——'+(TX.AUX[a]||TX.AUX2[a]||'')).join(';')+'。');
    if(misc.length) segs.push('雜曜:'+misc.map(a=>a+'('+(TX.AUX[a]||TX.AUX2[a]||'')+')').join(';')+'。');
  }
  // 十二神
  if(p.cs||p.bs) segs.push('本宮十二神:'+(p.cs?p.cs+'——'+(TX.CS12T[p.cs]||''):'')+(p.bs?';'+p.bs+'——'+(TX.BS12T[p.bs]||''):'')+'。長生十二神描繪此宮氣數的生命週期狀態,博士十二神則點出際遇中的吉凶色彩。');
  // 三方四正綜論
  const sf=SM.sanfang(p.zhi);
  const JI2=['左輔','右弼','文昌','文曲','天魁','天鉞','祿存'];
  const SHA2=['擎羊','陀羅','火星','鈴星','地空','地劫'];
  let jiN=0,shaN=0; const sfDesc=[];
  sf.forEach((z,i)=>{
    const pp=zw.palaces[z];
    pp.aux.forEach(a=>{ if(JI2.indexOf(a)>=0)jiN++; if(SHA2.indexOf(a)>=0)shaN++; });
    if(i>0&&pp.stars.length) sfDesc.push(pp.name+'有'+pp.stars.map(s=>s+SM.bright(s,z)).join('、'));
  });
  let verdict;
  if(jiN>=3&&shaN<=1) verdict='三方吉多煞少,此領域格局開闊、貴人成局,放心進取。';
  else if(shaN>=3&&jiN<=1) verdict='三方煞重吉輕,此領域考驗較多,宜步步為營、以柔克剛,煞星之力可化為突破現狀的動能。';
  else verdict='三方吉煞互見,順逆相參,謀定後動則吉。';
  segs.push('三方四正會照:'+(sfDesc.join(';')||'會照諸宮主星偏弱')+'。會照吉曜'+jiN+'顆、煞曜'+shaN+'顆——'+verdict);
  return segs;
};

  // 小限
  const xx=SM.xiaoxian(R.bz.pillars.year[1],R.inp.g,age);
  h+='<p><b>小限</b>:虛歲'+age+'小限行至'+R.zw.palaces[xx].name+'('+SM.ZHI[xx]+'宮),本年諸事於「'+(TX.PALACE_DOMAIN[R.zw.palaces[xx].name]||'')+'」一隅感受最深,與太歲、流年四化合參。</p>';
  h+='<div class="ln-mini"><h4>未來五年速覽</h4>';
  for(let k=1;k<=5;k++){
    const y2=yr+k, g=((y2-4)%10+10)%10;
    const tg=SM.tenGod(R.bz.pillars.day[0],g);
    const lp=R.zw.palaces[((y2-4)%12+12)%12];
    const sh2=SM.SIHUA[g];
    h+='<p class="mini">'+y2+' '+SM.gz(((y2-4)%60+60)%60)+'年|八字主題:'+tg+'('+TX.TENGOD[tg]+')|太歲入'+lp.name+'|四化:'+sh2[0]+'祿・'+sh2[3]+'忌</p>';
  }
  $('res-liunian').innerHTML=h+'</div>';
}
let CURRENT=null;
window.addEventListener('DOMContentLoaded',function(){
  fillDateSelects('p1'); fillDateSelects('h1'); fillDateSelects('h2'); fillDateSelects('n1');
  document.querySelectorAll('.tabbtn').forEach(b=>b.addEventListener('click',function(){
    document.querySelectorAll('.tabbtn').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.tab').forEach(x=>x.classList.add('hide'));
    b.classList.add('on'); $(b.dataset.t).classList.remove('hide');
  }));
  $('btn-pan').addEventListener('click',function(){
    try{ CURRENT=computeAll(getInput('p1')); renderResult(CURRENT); }
    catch(e){ alert('排盤失敗:請確認日期是否存在。'+e.message); }
  });
  $('btn-ln').addEventListener('click',function(){ if(CURRENT) renderLiunian(CURRENT); });
  $('btn-hh').addEventListener('click',function(){
    try{
      const a=getInput('h1'), b=getInput('h2');
      const b1=SM.bazi(a.y,a.m,a.d,a.h,a.min), b2=SM.bazi(b.y,b.m,b.d,b.h,b.min);
      const r=TX.hehun(SM,b1,b2);
      const gz1=['year','month','day','hour'].map(k=>SM.GAN[b1.pillars[k][0]]+SM.ZHI[b1.pillars[k][1]]).join(' ');
      const gz2=['year','month','day','hour'].map(k=>SM.GAN[b2.pillars[k][0]]+SM.ZHI[b2.pillars[k][1]]).join(' ');
      $('hh-out').innerHTML='<div class="score"><div class="scnum">'+r.score+'</div><div class="sclabel">合婚指數</div></div>'
        +'<p class="verdict">'+esc(r.verdict)+'</p>'
        +'<p class="mini">甲方四柱:'+gz1+'<br>乙方四柱:'+gz2+'</p>'
        +r.notes.map(n=>'<p>'+esc(n)+'</p>').join('')
        +'<p class="mini">註:合婚以日柱為核心、五行互補為要,生肖僅為參考。沖剋非絕對,知其性而善處之,即是化解。</p>';
      $('hh-out').classList.remove('hide');
    }catch(e){ alert('合婚計算失敗:'+e.message); }
  });
  $('btn-nm').addEventListener('click',function(){
    try{
      const surname=$('nm-surname').value.trim();
      if(!surname){ alert('請先輸入姓氏'); return; }
      const skIn=parseInt($('nm-strokes').value)||0;
      const inp=getInput('n1');
      const bz=SM.bazi(inp.y,inp.m,inp.d,inp.h,inp.min);
      const st=SM.fiveElemStats(bz);
      const r=TX.naming2(SM,surname,skIn,inp.g,st.xiyong,bz.pillars.year[1]);
      if(r.err==='noStroke'){ alert('「'+surname+'」不在內建姓氏字庫,請於「姓氏筆畫」欄填入該字的康熙筆畫數再試。'); return; }
      let h='<p>依生辰推得日主 <b>'+SM.GAN[bz.pillars.day[0]]+SM.GAN_ELEM[bz.pillars.day[0]]+'</b>,'
        +(st.strong?'身強':'身弱')+',喜用五行 <b class="e'+st.xiyong[0]+'">'+st.xiyong.join('、')+'</b>;'
        +'生肖屬<b>'+r.zodiac+'</b>;姓氏「'+esc(surname)+'」康熙筆畫 <b>'+r.sk+'</b> 畫。'
        +'以下候選名兼顧:①八字喜用神五行 ②三才五格數理 ③生肖字根喜忌,依綜合評分排序:</p><div class="nmgrid nmgrid2">';
      r.picks.forEach(p=>{
        const wg=p.wg, L=wg.levels;
        const geRow=['tian','ren','di','wai','zong'].map(k=>
          '<span class="ge ge'+L[k]+'">'+TX.GE_NAME[k]+wg[k]+'<i>'+L[k]+'</i></span>').join('');
        const zhits=[];
        p.z.forEach((zz,i)=>{
          const ch=i===0?p.a[0]:p.b[0];
          if(zz.hit.like.length) zhits.push(ch+'含'+zz.hit.like.join('')+'根(喜)');
          if(zz.hit.avoid.length) zhits.push(ch+'含'+zz.hit.avoid.join('')+'根(忌)');
        });
        h+='<div class="nmcard"><div class="nmname">'+esc(surname+p.a[0]+p.b[0])+'</div>'
          +'<div class="nmel">'+r.sk+'-'+p.a[2]+'-'+p.b[2]+' 畫|三才 '+wg.sancai.str+'('+wg.sancai.level+')</div>'
          +'<div class="gerow">'+geRow+'</div>'
          +'<div class="nmgl">'+esc(p.a[0]+'('+p.a[1]+')+'+p.b[0]+'('+p.b[1]+')')+'</div>'
          +'<div class="nmzo">'+(zhits.length?esc('生肖'+r.zodiac+':'+zhits.join('、')):'生肖字根無明顯喜忌')+'</div></div>';
      });
      h+='</div><p class="mini">說明:筆畫採康熙字典計法(氵=4、艹=6、阝左=8、王=5…)。五格=天格(姓+1)、人格(姓+名首)、地格(名二字)、外格(名末+1)、總格(全名),數理依 81 數吉凶;三才為天人地五格之五行生剋。生肖姓名學依出生年生肖論字根喜忌,各派略有出入,列為加減分參考。最終取名仍以八字喜用神為主軸,字義音韻為本。</p>';
      $('nm-out').innerHTML=h; $('nm-out').classList.remove('hide');
    }catch(e){ alert('取名計算失敗:'+e.message); }
  });
});
})();

/* 性別 radio 同步至隱藏欄位 */
"use strict";
(function(){
  [['p1g','p1-g'],['h1g','h1-g'],['h2g','h2-g'],['n1g','n1-g']].forEach(function(pair){
    document.addEventListener('change',function(e){
      if(e.target && e.target.name===pair[0]) document.getElementById(pair[1]).value=e.target.value;
    });
  });
})();

</script>
